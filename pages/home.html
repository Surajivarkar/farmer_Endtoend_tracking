<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Farmer App — Home</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif;
      background: #F8F9FA;
      color: #202124;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Top Nav ── */
    .top-nav {
      position: sticky;
      top: 0; z-index: 100;
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: none;
      box-shadow: 0 1px 0 0 #E8EAED;
      padding: 0 24px;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }


    .nav-brand {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; flex-shrink: 0;
    }

    .nav-right {
      display: flex; align-items: center; gap: 12px;
      flex-shrink: 0;
    }

    /* User pill — desktop */
    .nav-user {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 14px 5px 6px;
      background: #F1F3F4;
      border: 1px solid #E8EAED;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 500;
      color: #5F6368;
      white-space: nowrap;
    }

    .nav-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1557C9, #34A853);
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      font-size: 0.78rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    /* Logout button */
    .btn-logout {
      background: none;
      border: 1.5px solid #DADCE0;
      color: #5F6368;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn-logout:hover {
      border-color: #EA4335;
      color: #EA4335;
      background: #FFF5F5;
    }

    /* ── Mobile Nav overrides ── */
    @media (max-width: 640px) {
      .top-nav { padding: 0 14px; height: 60px; position: sticky; }

      /* Icon-only logo on mobile — crop left (symbol) portion */
      .nav-brand img {
        height: 44px !important;
        width: 44px !important;
        object-fit: cover;
        object-position: left center;
        border-radius: 10px;
      }

      /* Nav-user: avatar only, no name text */
      .nav-user {
        padding: 4px;
        background: transparent;
        border: none;
        gap: 0;
      }
      .nav-user span { display: none; }

      /* Avatar bigger so it's tappable */
      .nav-avatar { width: 36px; height: 36px; font-size: 0.85rem; }

      /* Logout: icon only, no text */
      .btn-logout {
        padding: 7px;
        border-radius: 50%;
        width: 36px; height: 36px;
        justify-content: center;
      }
      .btn-logout span { display: none; }

      /* Language dropdown compact */
      .app-lang-wrap { padding: 4px 8px; }
      .app-lang-wrap select { min-width: 56px; font-size: 0.78rem; }
    }

    /* ── Main layout ── */
    .page-body {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }

    /* ── Welcome banner ── */
    .welcome-banner {
      background:
        linear-gradient(130deg, rgba(21,87,201,0.88) 0%, rgba(26,115,232,0.80) 45%, rgba(52,168,83,0.88) 100%),
        url('https://images.unsplash.com/photo-1471194402529-8e0f5a675de6?auto=format&fit=crop&w=1200&q=80');
      background-size: cover;
      background-position: center 60%;
      border-radius: 16px;
      padding: 36px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 32px;
      position: relative;
      overflow: hidden;
    }

    .welcome-banner::before {
      content: '';
      position: absolute;
      width: 300px; height: 300px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      top: -100px; right: -80px;
    }

    .welcome-left { position: relative; z-index: 1; }

    .welcome-greeting {
      font-size: 0.82rem;
      font-weight: 500;
      color: rgba(255,255,255,0.72);
      letter-spacing: 0.3px;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .welcome-name {
      font-size: clamp(1.4rem, 2.5vw, 1.9rem);
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 8px;
    }

    .welcome-sub {
      font-size: 0.88rem;
      color: rgba(255,255,255,0.72);
    }

    .welcome-btn {
      background: #FFFFFF;
      color: #1A73E8;
      padding: 12px 28px;
      border-radius: 24px;
      font-size: 0.92rem;
      font-weight: 700;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      transition: box-shadow 0.2s, transform 0.15s;
      position: relative; z-index: 1;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    }

    .welcome-btn:hover {
      box-shadow: 0 6px 20px rgba(0,0,0,0.18);
      transform: translateY(-2px);
    }

    /* ── Stats row ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: #FFFFFF;
      border: 1.5px solid #E8EAED;
      border-radius: 14px;
      padding: 24px 20px;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .stat-icon {
      width: 52px; height: 52px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .stat-icon.green  { background: #E8F5E9; }
    .stat-icon.orange { background: #FFF8E1; }
    .stat-icon.red    { background: #FFEBEE; }

    .stat-num {
      font-size: 1.8rem;
      font-weight: 800;
      color: #202124;
      font-family: 'Poppins', sans-serif;
      letter-spacing: -0.5px;
      line-height: 1;
    }

    .stat-label {
      font-size: 0.78rem;
      color: #9AA0A6;
      margin-top: 4px;
      font-weight: 500;
    }

    /* ── Section titles ── */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .section-head-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #202124;
    }

    /* ── Two-col layout ── */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 32px;
    }

    /* ── Info cards ── */
    .info-card {
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      height: 120px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: box-shadow 0.2s, transform 0.15s;
      cursor: pointer;
      text-decoration: none;
    }

    .info-card:hover {
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      transform: translateY(-2px);
    }

    .info-card-content {
      flex: 1;
      padding: 20px;
      display: flex;
      align-items: center;
    }

    .info-card-content span {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.45;
      color: #fff;
    }

    .info-card-art {
      width: 120px;
      flex-shrink: 0;
    }

    .info-card-art svg { width: 100%; height: 100%; }

    .info-card.green .info-card-content  { background: linear-gradient(135deg, #1B5E20, #34A853); }
    .info-card.green .info-card-art      { background: linear-gradient(135deg, #43A047, #66BB6A); }
    .info-card.blue  .info-card-content  { background: linear-gradient(135deg, #0D47A1, #1E88E5); }
    .info-card.blue  .info-card-art      { background: linear-gradient(135deg, #1565C0, #42A5F5); }

    /* ── Quick start card ── */
    .quick-start {
      background: #FFFFFF;
      border: 1.5px solid #E8EAED;
      border-radius: 14px;
      padding: 28px 24px;
    }

    .steps-progress {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 16px;
    }

    .progress-step {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1.5px solid #E8EAED;
      transition: background 0.2s, border-color 0.2s;
      cursor: pointer;
    }

    .progress-step:hover { background: #F0F4FF; border-color: #1A73E8; }
    .progress-step.done  { background: #F1F8FE; border-color: #BBDEFB; }

    .progress-step-num {
      width: 30px; height: 30px;
      border-radius: 50%;
      font-size: 0.76rem;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-family: 'Poppins', sans-serif;
    }

    .progress-step-num.done    { background: linear-gradient(135deg, #1557C9, #34A853); color: #fff; }
    .progress-step-num.pending { background: #E8EAED; color: #9AA0A6; }
    .progress-step-num.active  { background: linear-gradient(135deg, #1A73E8, #00A8CC); color: #fff; }

    .progress-step-name {
      font-size: 0.88rem;
      font-weight: 600;
      color: #202124;
      flex: 1;
    }

    .progress-step.done .progress-step-name { color: #1557C9; }

    .progress-step-status {
      font-size: 0.72rem;
      font-weight: 600;
    }

    .progress-step.done .progress-step-status { color: #1A73E8; }
    .progress-step:not(.done) .progress-step-status { color: #9AA0A6; }

    /* ── Logout btn ── */
    .btn-logout {
      background: none;
      border: 1.5px solid #DADCE0;
      color: #5F6368;
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 500;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-logout:hover {
      border-color: #E53935;
      color: #E53935;
      background: #FFF5F5;
    }

    /* ── Toast ── */
    .toast-wrap {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%);
      z-index: 999; pointer-events: none;
    }

    .toast-msg {
      background: #202124;
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-family: 'Poppins', sans-serif;
      font-weight: 500;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.25s, transform 0.25s;
      white-space: nowrap;
    }

    .toast-msg.show { opacity: 1; transform: translateY(0); }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .main-grid { grid-template-columns: 1fr; }
      .stats-row { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 640px) {
      .page-body { padding: 20px 16px 80px; }
      .welcome-banner { flex-direction: column; align-items: flex-start; padding: 24px 20px; }
      .stats-row { grid-template-columns: 1fr 1fr; }
      .stat-card:last-child { grid-column: 1 / -1; }
    }

    @media (max-width: 480px) {
      .stats-row { grid-template-columns: 1fr; }
      .stat-card:last-child { grid-column: auto; }
      .info-card { height: 100px; }
    }

    /* ── App Bottom Nav — mobile only ── */
    .app-mob-nav {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 62px;
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid #E8EAED;
      align-items: center;
      justify-content: space-around;
      z-index: 200;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      box-shadow: 0 -2px 16px rgba(0,0,0,0.06);
    }

    .app-mob-nav a {
      display: flex; flex-direction: column;
      align-items: center; gap: 2px;
      text-decoration: none;
      font-size: 0.62rem; font-weight: 600;
      font-family: 'Poppins', sans-serif;
      padding: 5px 14px;
      color: #9AA0A6;
    }

    .app-mob-nav a.active { color: #1A73E8; font-weight: 700; }

    @media (max-width: 768px) {
      .app-mob-nav { display: flex; }
      .page-body { padding-bottom: 80px; }
    }
  </style>
</head>
<body>

<!-- TOP NAV -->
<header class="top-nav" style="position:sticky; border-bottom: 2px solid transparent; border-image: linear-gradient(90deg, #1557C9, #1A73E8, #34A853) 1;">
  <a href="../index.html" class="nav-brand">
    <img src="../assets/images/logo.png" alt="MapFarmer" style="height:50px;width:auto;display:block;object-fit:contain;transition:transform 0.2s;" onmouseover="this.style.transform='scale(1.04)'" onmouseout="this.style.transform='scale(1)'">
  </a>
  <div class="nav-right">
    <!-- Language Dropdown -->
    <div class="app-lang-wrap" id="langWrap">
      <svg class="alw-globe" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <select id="langSelect" aria-label="Select Language" onchange="changeLang(this.value)">
        <option value="en">English</option>
        <option value="mr" selected>मराठी</option>
        <option value="hi">हिन्दी</option>
      </select>
      <svg class="alw-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
    </div>

    <div class="nav-user">
      <div class="nav-avatar" id="nav-avatar">श</div>
      <span id="nav-name">शेतकरी</span>
    </div>
    <button class="btn-logout" onclick="handleLogout()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
      </svg>
      <span data-i18n="logout">Logout</span>
    </button>
  </div>
</header>

<main class="page-body">

  <!-- Welcome Banner -->
  <div class="welcome-banner fade-in-up">
    <div class="welcome-left">
      <div class="welcome-greeting" data-i18n="greeting">नमस्कार</div>
      <div class="welcome-name" id="welcome-name">शेतकरी</div>
      <div class="welcome-sub" id="hero-tagline" data-i18n="heroTag">चला तुमची शेती प्रक्रिया टप्याटप्याने टिपूया</div>
    </div>
    <a href="instructions.html" class="welcome-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      <span data-i18n="start">Start</span>
    </a>
  </div>

  <!-- Stats -->
  <div class="stats-row fade-in-up fade-in-up-delay-1">
    <div class="stat-card">
      <div class="stat-icon green">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#34A853" stroke-width="2" stroke-linecap="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </div>
      <div>
        <div class="stat-num">10</div>
        <div class="stat-label" data-i18n="statSteps">शेती टप्पे</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon orange">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F9A825" stroke-width="2" stroke-linecap="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      </div>
      <div>
        <div class="stat-num" id="completed-count">0</div>
        <div class="stat-label" id="stat-completed-label">पूर्ण झाले</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon red">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#E53935" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <div>
        <div class="stat-num" id="remaining-count">10</div>
        <div class="stat-label" id="stat-remaining-label">बाकी आहे</div>
      </div>
    </div>
  </div>

  <!-- Main content grid -->
  <div class="main-grid">

    <!-- Info cards -->
    <div>
      <div class="section-head">
        <div class="section-head-title" data-i18n="features">माहिती</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:16px;">
        <a href="instructions.html" class="info-card green">
          <div class="info-card-content">
            <span id="card1-text" data-i18n="card1">पिकांबद्दल माहिती</span>
          </div>
          <div class="info-card-art">
            <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
              <g transform="translate(30, 15)">
                <line x1="30" y1="90" x2="30" y2="40" stroke="#A5D6A7" stroke-width="3"/>
                <path d="M30 40C30 40 20 28 20 18C20 8 25 4 30 4C35 4 40 8 40 18C40 28 30 40 30 40Z" fill="#81C784"/>
                <path d="M30 12C30 12 28 22 25 28" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none"/>
                <line x1="20" y1="90" x2="20" y2="55" stroke="#A5D6A7" stroke-width="2.5"/>
                <path d="M20 55C20 55 12 46 12 38C12 30 16 27 20 27C24 27 28 30 28 38C28 46 20 55 20 55Z" fill="#66BB6A"/>
                <line x1="40" y1="90" x2="40" y2="48" stroke="#A5D6A7" stroke-width="2.5"/>
                <path d="M40 48C40 48 32 40 32 32C32 24 36 21 40 21C44 21 48 24 48 32C48 40 40 48 40 48Z" fill="#66BB6A"/>
                <line x1="10" y1="90" x2="50" y2="90" stroke="#4CAF50" stroke-width="2" stroke-linecap="round"/>
                <circle cx="52" cy="18" r="8" fill="#FDD835" opacity="0.6"/>
                <circle cx="52" cy="18" r="5" fill="#F9A825"/>
              </g>
            </svg>
          </div>
        </a>

        <a href="instructions.html" class="info-card blue">
          <div class="info-card-content">
            <span id="card2-text" data-i18n="card2">सर्वोत्तम कीटकनाशक</span>
          </div>
          <div class="info-card-art">
            <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
              <g transform="translate(20, 10)">
                <path d="M40 90C40 90 10 68 10 40C10 14 40 6 40 6C40 6 70 14 70 40C70 68 40 90 40 90Z" fill="rgba(255,255,255,0.15)"/>
                <path d="M40 14C40 14 38 32 34 46C31 55 31 64 40 68" stroke="rgba(255,255,255,0.3)" stroke-width="2" fill="none"/>
                <path d="M40 14C40 14 45 30 52 42C57 52 56 62 40 68" stroke="rgba(255,255,255,0.2)" stroke-width="2" fill="none"/>
                <path d="M22 50 Q40 44 58 50" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" fill="none"/>
              </g>
            </svg>
          </div>
        </a>
      </div>
    </div>

    <!-- Progress -->
    <div class="quick-start">
      <div class="section-head">
        <div class="section-head-title" data-i18n="progressTitle">शेती टप्पे</div>
        <a href="view.html" style="font-size:0.84rem;color:#1A73E8;font-weight:600;text-decoration:none;" data-i18n="viewAll">सगळे पहा</a>
      </div>
      <div class="steps-progress" id="steps-list"></div>
    </div>

  </div>

</main>

<!-- Toast -->
<div class="toast-wrap">
  <div class="toast-msg" id="toastMsg"></div>
</div>

<div id="toast" class="google-toast"></div>

<!-- ── App Bottom Nav — mobile only ── -->

<script src="../js/config.js"></script>
<script src="../js/state.js"></script>
<script src="../js/utils.js"></script>
<script>
  if (!isLoggedIn()) { window.location.href = 'login.html'; }

  function handleLogout() {
    state.user = { name: '', role: 'farmer', aadhar: '' };
    saveState();
    window.location.href = 'login.html';
  }

  function renderStepsProgress() {
    var lang = state.lang || 'mr';
    var completed = state.stepPhotos.filter(function(p) { return p !== null; }).length;
    
    document.getElementById('completed-count').textContent = completed;
    document.getElementById('remaining-count').textContent = 10 - completed;

    // Stat labels according to language
    var compLabels = { mr: 'पूर्ण झाले', en: 'Completed', hi: 'पूर्ण हुए' };
    var remLabels  = { mr: 'बाकी आहे', en: 'Pending', hi: 'शेष हैं' };
    var activeLabels = { mr: 'चालू टप्पा', en: 'Active Step', hi: 'सक्रिय चरण' };
    var doneLabels = { mr: 'नोंद पूर्ण ✅', en: 'Documented ✅', hi: 'दर्ज हुआ ✅' };

    var compLabelEl = document.getElementById('stat-completed-label');
    var remLabelEl  = document.getElementById('stat-remaining-label');
    if (compLabelEl) compLabelEl.textContent = compLabels[lang] || compLabels.mr;
    if (remLabelEl)  remLabelEl.textContent  = remLabels[lang] || remLabels.mr;

    var list = document.getElementById('steps-list');
    if (!list) return;

    var steps = STEPS.slice(0, 10);
    list.innerHTML = steps.map(function(s, i) {
      var done = state.stepPhotos[i] !== null;
      var isCurrent = (i === completed);
      var status = done ? (doneLabels[lang] || 'पूर्ण') : (isCurrent ? (activeLabels[lang] || 'Active') : (remLabels[lang] || 'बाकी'));
      var cls = done ? 'done' : (isCurrent ? 'active' : 'pending');
      var stepTitle = s[lang] || s.mr;
      var stepSubtitle = lang === 'en' ? s.mr : s.en;

      return '<div class="progress-step ' + (done ? 'done' : '') + '" onclick="goTo(\'capture.html?step=' + i + '\')" style="cursor:pointer;" title="Click to document step">' +
        '<div class="progress-step-num ' + cls + '">' + (done ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>' : (i + 1)) + '</div>' +
        '<div class="progress-step-name">' + s.emoji + ' ' + stepTitle + ' <span style="opacity:0.5;font-size:0.76rem;font-weight:400">(' + stepSubtitle + ')</span></div>' +
        '<div class="progress-step-status">' + status + '</div>' +
        '</div>';
    }).join('');
  }

  function goTo(url) { window.location.href = url; }

  function updateBottomNavLabels() {
    var lang = state.lang || 'mr';
    var l = {
      mr: { home:'होम', capture:'फोटो', gallery:'गॅलरी', info:'माहिती' },
      en: { home:'Home', capture:'Capture', gallery:'Gallery', info:'Guide' },
      hi: { home:'होम', capture:'फोटो', gallery:'गैलरी', info:'जानकारी' }
    }[lang] || { home:'होम', capture:'फोटो', gallery:'गॅलरी', info:'माहिती' };
    var h=document.getElementById('abn-home-lbl2');
    var c=document.getElementById('abn-capture-lbl2');
    var g=document.getElementById('abn-gallery-lbl2');
    var i=document.getElementById('abn-info-lbl2');
    if(h) h.textContent=l.home;
    if(c) c.textContent=l.capture;
    if(g) g.textContent=l.gallery;
    if(i) i.textContent=l.info;
  }

  (function initHome() {
    var name = state.user.name || 'शेतकरी';
    document.getElementById('welcome-name').textContent = name;
    document.getElementById('nav-name').textContent = name;
    var initial = name.charAt(0).toUpperCase();
    document.getElementById('nav-avatar').textContent = initial;

    applyLang();
    renderStepsProgress();
    updateBottomNavLabels();

    window.addEventListener('languageChanged', function() {
      renderStepsProgress();
      updateBottomNavLabels();
    });
  })();
</script>
