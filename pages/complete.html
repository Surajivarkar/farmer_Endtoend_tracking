<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShhetKari — प्रक्रिया पूर्ण</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/base.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif;
      background: #F8F9FA;
      color: #202124;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Confetti dots ── */
    .confetti-wrap {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .c-dot {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
      animation: cFloat 4s ease-in-out infinite;
    }

    .c-dot:nth-child(1)  { width:10px;height:10px; top:8%;left:12%; background:#34A853; animation-delay:0s; }
    .c-dot:nth-child(2)  { width:7px;height:7px; top:15%;right:18%; background:#1A73E8; animation-delay:0.6s; }
    .c-dot:nth-child(3)  { width:12px;height:12px; top:25%;left:8%; background:#F9AB00; animation-delay:0.3s; }
    .c-dot:nth-child(4)  { width:8px;height:8px; top:10%;right:10%; background:#EA4335; animation-delay:0.9s; }
    .c-dot:nth-child(5)  { width:9px;height:9px; bottom:22%;left:14%; background:#34A853; animation-delay:1.1s; }
    .c-dot:nth-child(6)  { width:7px;height:7px; bottom:18%;right:12%; background:#F9AB00; animation-delay:0.2s; }
    .c-dot:nth-child(7)  { width:11px;height:11px; top:42%;left:6%; background:#1A73E8; animation-delay:0.7s; }
    .c-dot:nth-child(8)  { width:8px;height:8px; top:38%;right:7%; background:#34A853; animation-delay:0.4s; }

    @keyframes cFloat {
      0%   { opacity:0; transform:translateY(20px) scale(0.5); }
      20%  { opacity:0.5; }
      50%  { opacity:0.4; transform:translateY(-10px) scale(1); }
      100% { opacity:0; transform:translateY(20px) scale(0.5); }
    }

    /* ── Card ── */
    .complete-card {
      background: #fff;
      border: 1.5px solid #E8EAED;
      border-radius: 24px;
      padding: 40px 36px;
      max-width: 480px;
      width: calc(100% - 32px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      position: relative;
      z-index: 1;
      box-shadow: 0 8px 40px rgba(0,0,0,0.08);
      animation: cardIn 0.5s cubic-bezier(0.2,0,0,1) both;
    }

    @keyframes cardIn {
      from { opacity:0; transform:translateY(24px) scale(0.97); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }

    /* ── Back button ── */
    .card-back {
      position: absolute;
      top: 18px; left: 18px;
      width: 38px; height: 38px;
      border-radius: 50%;
      background: #F8F9FA;
      border: 1.5px solid #E8EAED;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #5F6368;
      text-decoration: none;
      transition: background 0.15s;
    }
    .card-back:hover { background: #E8EAED; color: #202124; }

    /* ── Illustration ── */
    .success-illustration {
      width: 140px; height: 140px;
      animation: illIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.1s both;
    }

    @keyframes illIn {
      from { opacity:0; transform:scale(0.6); }
      to   { opacity:1; transform:scale(1); }
    }

    /* ── Success badge ── */
    .success-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #E8F5E9;
      color: #1E8E3E;
      border: 1.5px solid #A5D6A7;
      border-radius: 20px;
      padding: 7px 18px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* ── Stats ── */
    .stats-row {
      display: flex;
      gap: 16px;
      width: 100%;
    }

    .stat-card {
      flex: 1;
      background: #F8F9FA;
      border: 1.5px solid #E8EAED;
      border-radius: 14px;
      padding: 16px;
      text-align: center;
    }

    .stat-num {
      font-size: 2rem;
      font-weight: 800;
      font-family: 'Poppins', sans-serif;
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .stat-num.green { color: #34A853; }
    .stat-num.blue  { color: #1A73E8; }

    .stat-label {
      font-size: 0.75rem;
      color: #5F6368;
      font-weight: 500;
    }

    /* ── Message ── */
    .complete-msg {
      text-align: center;
      background: #F8F9FA;
      border-radius: 14px;
      padding: 18px 20px;
      border: 1.5px solid #E8EAED;
      width: 100%;
    }

    .complete-msg p:first-child {
      font-size: 0.92rem;
      font-weight: 600;
      color: #202124;
      line-height: 1.6;
      margin-bottom: 6px;
    }

    .complete-msg p.sub {
      font-size: 0.82rem;
      color: #34A853;
      font-weight: 600;
    }

    /* ── Actions ── */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .btn-save {
      width: 100%;
      background: #34A853;
      color: #fff;
      border: none;
      border-radius: 28px;
      padding: 15px;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 2px 10px rgba(52,168,83,0.3);
    }
    .btn-save:hover { background: #1E8E3E; }
    .btn-save:active { transform: scale(0.98); }

    .btn-view {
      width: 100%;
      background: #fff;
      color: #202124;
      border: 1.5px solid #E8EAED;
      border-radius: 28px;
      padding: 13px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-view:hover { border-color: #1A73E8; color: #1A73E8; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: #202124;
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 500px) {
      .complete-card { padding: 28px 20px; border-radius: 20px; }
      .stat-num { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

<!-- Confetti -->
<div class="confetti-wrap" aria-hidden="true">
  <div class="c-dot"></div><div class="c-dot"></div><div class="c-dot"></div>
  <div class="c-dot"></div><div class="c-dot"></div><div class="c-dot"></div>
  <div class="c-dot"></div><div class="c-dot"></div>
</div>

<!-- Success Card -->
<div class="complete-card">

  <div style="width:100%; display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
    <a href="home.html" class="card-back" title="घरी जा" style="position:static;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M19 12H5"/><path d="M12 5l-7 7 7 7"/>
      </svg>
    </a>

    <img src="../assets/images/logo.png" alt="MapFarmer" style="height:44px;width:auto;object-fit:contain;">

    <!-- Language Dropdown -->
    <div class="app-lang-wrap" id="langWrap">
      <svg class="alw-globe" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <select id="langSelect" aria-label="Select Language" onchange="changeLang(this.value)">
        <option value="en">English</option>
        <option value="mr" selected>मराठी</option>
        <option value="hi">हिन्दी</option>
      </select>
      <svg class="alw-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
  </div>

  <!-- Illustration -->
  <div class="success-illustration">
    <svg viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="70" cy="70" r="68" fill="#E8F5E9"/>
      <rect x="50" y="82" width="40" height="34" rx="8" fill="#A5D6A7"/>
      <circle cx="70" cy="65" r="18" fill="#D4A574"/>
      <ellipse cx="70" cy="50" rx="22" ry="7" fill="#34A853"/>
      <rect x="52" y="44" width="36" height="8" rx="4" fill="#2E7D32"/>
      <path d="M62 68 Q70 76 78 68" stroke="#6D4C41" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle cx="64" cy="62" r="2.5" fill="#6D4C41"/>
      <circle cx="76" cy="62" r="2.5" fill="#6D4C41"/>
      <circle cx="60" cy="68" r="3.5" fill="#F97316" opacity=".35"/>
      <circle cx="80" cy="68" r="3.5" fill="#F97316" opacity=".35"/>

      <!-- Checkmark badge -->
      <circle cx="104" cy="36" r="20" fill="#34A853"/>
      <path d="M95 36 L101 42 L113 30" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Wheat stalk left -->
      <line x1="36" y1="120" x2="36" y2="60" stroke="#8BC34A" stroke-width="2.5"/>
      <ellipse cx="36" cy="62" rx="7" ry="11" fill="#AED581" transform="rotate(-20 36 62)"/>
      <ellipse cx="36" cy="76" rx="6" ry="10" fill="#AED581" transform="rotate(18 36 76)"/>
      <ellipse cx="36" cy="88" rx="6" ry="9" fill="#AED581" transform="rotate(-14 36 88)"/>

      <!-- Wheat stalk right -->
      <line x1="104" y1="120" x2="104" y2="68" stroke="#8BC34A" stroke-width="2.5"/>
      <ellipse cx="104" cy="70" rx="7" ry="11" fill="#AED581" transform="rotate(20 104 70)"/>
      <ellipse cx="104" cy="84" rx="6" ry="10" fill="#AED581" transform="rotate(-18 104 84)"/>
      <ellipse cx="104" cy="96" rx="6" ry="9" fill="#AED581" transform="rotate(14 104 96)"/>

      <ellipse cx="70" cy="122" rx="44" ry="8" fill="#C8E6C9"/>
    </svg>
  </div>

  <!-- Badge -->
  <div class="success-badge" id="badge-complete-text">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/>
      <polyline points="22 4 12 14.01 9 11.01"/>
    </svg>
    सर्व टप्पे पूर्ण!
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-num green" id="photos-count">0</div>
      <div class="stat-label" id="lbl-photos-count">फोटो अपलोड</div>
    </div>
    <div class="stat-card">
      <div class="stat-num blue">10</div>
      <div class="stat-label" id="lbl-total-steps">एकूण टप्पे</div>
    </div>
  </div>

  <!-- Message -->
  <div class="complete-msg">
    <p id="complete-main-msg">छान! तुम्ही सर्व प्रक्रिया योग्यरित्या आणि यशस्वीरित्या कॅप्चर केल्यात!</p>
    <p class="sub" id="complete-sub-msg">चला ते आता सेव्ह करूया</p>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button class="btn-save" onclick="saveProcess()" id="btn-save-label">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
        <polyline points="17 21 17 13 7 13 7 21"/>
        <polyline points="7 3 7 8 15 8"/>
      </svg>
      प्रक्रिया सेव्ह करा
    </button>
    <a href="view.html" class="btn-view" id="btn-view-label">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      सर्व टप्पे पहा
    </a>
  </div>

</div>

<div id="toast" class="google-toast"></div>

<script src="../js/config.js"></script>
<script src="../js/state.js"></script>
<script src="../js/utils.js"></script>
<script>
  if (!isLoggedIn()) { window.location.href = 'login.html'; }

  function renderCompleteCard() {
    var lang = state.lang || 'mr';
    var uploadedCount = state.stepPhotos.filter(function(p) { return p !== null; }).length;
    document.getElementById('photos-count').textContent = uploadedCount;

    var badges = { mr: 'सर्व १० टप्पे पूर्ण!', en: 'All 10 Steps Complete!', hi: 'सभी १० चरण पूर्ण!' };
    var lblPhotos = { mr: 'फोटो अपलोड', en: 'Photos Uploaded', hi: 'फोटो अपलोड' };
    var lblTotal = { mr: 'एकूण टप्पे', en: 'Total Steps', hi: 'कुल चरण' };
    var mainMsgs = {
      mr: 'छान! तुम्ही सर्व प्रक्रिया योग्यरित्या आणि यशस्वीरित्या कॅप्चर केल्यात!',
      en: 'Splendid! You have thoroughly and accurately documented every step!',
      hi: 'उत्कृष्ट! आपने सभी चरणों का सटीक और सफल दस्तावेज़ीकरण कर लिया है!'
    };
    var subMsgs = {
      mr: 'तुमची नोंदणी सुरक्षित झाली असून सेंद्रिय प्रमाणपत्र तयार आहे.',
      en: 'Your farm records are locked and your Organic Certificate is ready.',
      hi: 'आपकी प्रविष्टियां सुरक्षित हो चुकी हैं और जैविक प्रमाण पत्र तैयार है।'
    };
    var saveBtns = { mr: 'प्रक्रिया सेव्ह करा', en: 'Save Records', hi: 'प्रक्रिया सुरक्षित करें' };
    var viewBtns = { mr: 'सर्व टप्पे पहा', en: 'View All Steps', hi: 'सभी चरण देखें' };

    var bEl = document.getElementById('badge-complete-text');
    var pEl = document.getElementById('lbl-photos-count');
    var tEl = document.getElementById('lbl-total-steps');
    var mEl = document.getElementById('complete-main-msg');
    var sEl = document.getElementById('complete-sub-msg');
    var sbEl= document.getElementById('btn-save-label');
    var vbEl= document.getElementById('btn-view-label');

    if (bEl) bEl.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> ' + (badges[lang] || badges.mr);
    if (pEl) pEl.textContent = lblPhotos[lang] || lblPhotos.mr;
    if (tEl) tEl.textContent = lblTotal[lang] || lblTotal.mr;
    if (mEl) mEl.textContent = mainMsgs[lang] || mainMsgs.mr;
    if (sEl) sEl.textContent = subMsgs[lang] || subMsgs.mr;
    if (sbEl) sbEl.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> ' + (saveBtns[lang] || saveBtns.mr);
    if (vbEl) vbEl.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> ' + (viewBtns[lang] || viewBtns.mr);
  }

  function saveProcess() {
    saveState();
    var lang = state.lang || 'mr';
    var okMsg = { mr: 'प्रक्रिया सेव्ह झाली! ✅', en: 'Process Saved! ✅', hi: 'प्रक्रिया सुरक्षित हुई! ✅' };
    showToast(okMsg[lang] || okMsg.mr, 'success');
    setTimeout(function() { window.location.href = 'home.html'; }, 1200);
  }

  applyLang();
  renderCompleteCard();

  window.addEventListener('languageChanged', function() {
    renderCompleteCard();
  });
</script>
</body>
</html>
