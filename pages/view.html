<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ShhetKari — सर्व टप्पे</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/base.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif;
      background: #F8F9FA;
      color: #202124;
      min-height: 100vh;
    }

    /* ── Top Navigation ── */
    .top-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 64px;
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(10px);
      border-bottom: 1.5px solid #E8EAED;
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 14px;
      z-index: 100;
    }

    .nav-back {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #5F6368;
      transition: background 0.15s;
      text-decoration: none;
      flex-shrink: 0;
    }
    .nav-back:hover { background: #F1F3F4; color: #202124; }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .nav-brand-name {
      font-size: 1rem;
      font-weight: 600;
      color: #202124;
    }

    .nav-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(130deg, #1557C9 0%, #1A73E8 45%, #34A853 100%);
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 7px 16px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: box-shadow 0.15s, transform 0.1s;
      flex-shrink: 0;
      box-shadow: 0 2px 10px rgba(26,115,232,0.3);
    }
    .nav-action-btn:hover { box-shadow: 0 4px 16px rgba(26,115,232,0.4); transform: translateY(-1px); }

    @media (max-width: 640px) {
      .top-nav { padding: 0 12px; height: 56px; gap: 8px; }
      /* Icon-only logo on mobile */
      .nav-brand img { height: 44px !important; width: 44px !important; object-fit: cover; object-position: left center; border-radius: 10px; }
      .nav-action-btn .btn-txt { display: none; }
      .nav-action-btn { padding: 8px 10px; gap: 0; border-radius: 50%; width: 36px; height: 36px; justify-content: center; }
      .app-lang-wrap { padding: 4px 8px; }
      .app-lang-wrap select { min-width: 54px; font-size: 0.78rem; }
    }

    /* ── Page Layout ── */
    .page-body {
      max-width: 900px;
      margin: 0 auto;
      padding: 84px 24px 56px;
    }

    /* ── User greeting ── */
    .greeting-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .greeting-avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: #E8F5E9;
      border: 2px solid #A5D6A7;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .greeting-text {
      flex: 1;
    }

    .greeting-text .hi {
      font-size: 0.82rem;
      color: #5F6368;
      font-weight: 500;
    }

    .greeting-text .name {
      font-size: 1rem;
      font-weight: 700;
      color: #202124;
    }

    /* ── Progress section ── */
    .progress-section {
      background: #fff;
      border: 1.5px solid #E8EAED;
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 24px;
    }

    .prog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .prog-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #202124;
    }

    .prog-count {
      font-size: 0.85rem;
      font-weight: 700;
      color: #34A853;
      font-family: 'Poppins', sans-serif;
    }

    .prog-bar-bg {
      height: 8px;
      background: #E8EAED;
      border-radius: 4px;
      overflow: hidden;
    }

    .prog-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #1557C9, #1A73E8, #34A853);
      border-radius: 4px;
      transition: width 0.6s cubic-bezier(0.2,0,0,1);
    }

    .prog-sublabel {
      font-size: 0.75rem;
      color: #9AA0A6;
      margin-top: 8px;
    }

    /* ── Steps Grid ── */
    .section-label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #9AA0A6;
      margin-bottom: 14px;
    }

    .steps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
    }

    .step-cell {
      background: #fff;
      border: 1.5px solid #E8EAED;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: box-shadow 0.15s, transform 0.15s;
      position: relative;
    }

    .step-cell:hover {
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      transform: translateY(-3px);
    }

    .step-cell.has-photo {
      border-color: #1A73E8;
      border-width: 2px;
    }

    .step-cell {
      animation: cellFadeIn 0.4s ease both;
    }

    @keyframes cellFadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    .steps-grid > .step-cell:nth-child(1) { animation-delay: 0.05s; }
    .steps-grid > .step-cell:nth-child(2) { animation-delay: 0.1s; }
    .steps-grid > .step-cell:nth-child(3) { animation-delay: 0.15s; }
    .steps-grid > .step-cell:nth-child(4) { animation-delay: 0.2s; }
    .steps-grid > .step-cell:nth-child(5) { animation-delay: 0.25s; }
    .steps-grid > .step-cell:nth-child(6) { animation-delay: 0.3s; }
    .steps-grid > .step-cell:nth-child(7) { animation-delay: 0.35s; }
    .steps-grid > .step-cell:nth-child(8) { animation-delay: 0.4s; }
    .steps-grid > .step-cell:nth-child(9) { animation-delay: 0.45s; }
    .steps-grid > .step-cell:nth-child(10){ animation-delay: 0.5s; }

    /* Image / placeholder */
    .cell-image-area {
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      position: relative;
    }

    .cell-image-area img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    .cell-placeholder {
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }

    /* Step number badge */
    .cell-num {
      position: absolute;
      top: 7px; left: 7px;
      width: 26px; height: 26px;
      border-radius: 50%;
      background: rgba(32,33,36,0.75);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      font-family: 'Poppins', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      z-index: 2;
    }

    .cell-num.done { background: linear-gradient(135deg, #1557C9, #34A853); }

    /* Done checkmark */
    .cell-done-badge {
      position: absolute;
      top: 7px; right: 7px;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: #34A853;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    /* Footer info */
    .cell-footer {
      padding: 10px 11px 11px;
    }

    .cell-name {
      font-size: 0.78rem;
      font-weight: 600;
      color: #202124;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .cell-status {
      font-size: 0.7rem;
      color: #9AA0A6;
      font-weight: 500;
    }

    .cell-status.done-text { color: #34A853; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: #202124;
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 600px) {
      .page-body { padding: 76px 14px 90px; }
      .steps-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    }

    @media (min-width: 700px) {
      .steps-grid { grid-template-columns: repeat(4, 1fr); }
    }

    @media (min-width: 900px) {
      .steps-grid { grid-template-columns: repeat(5, 1fr); }
    }

    /* ── Lightbox ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 9000;
      align-items: center;
      justify-content: center;
      touch-action: pan-y;
    }
    .lightbox.open { display: flex; }

    .lb-content {
      position: relative;
      max-width: 92vw;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .lb-img-wrap {
      width: 100%;
      max-height: 75vh;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
    }

    #lb-img {
      max-width: 100%;
      max-height: 75vh;
      object-fit: contain;
      display: block;
      border-radius: 10px;
      animation: lbFadeIn 0.22s ease;
    }

    @keyframes lbFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to   { opacity: 1; transform: scale(1); }
    }

    .lb-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 12px;
    }

    .lb-title {
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
    }

    .lb-num {
      color: rgba(255,255,255,0.6);
      font-size: 0.82rem;
      font-family: 'Poppins', sans-serif;
      flex-shrink: 0;
    }

    .lb-no-photo {
      color: rgba(255,255,255,0.5);
      font-size: 0.88rem;
      margin-top: 8px;
    }

    .lb-btn-row {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    .lb-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 20px;
      border-radius: 20px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
    }
    .lb-btn:hover { opacity: 0.85; }
    .lb-btn.primary {
      background: linear-gradient(130deg, #1557C9 0%, #1A73E8 45%, #34A853 100%);
      color: #fff;
    }
    .lb-btn.secondary {
      background: rgba(255,255,255,0.14);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .lb-close {
      position: absolute;
      top: 14px; right: 14px;
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: none;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      z-index: 10;
      transition: background 0.15s;
    }
    .lb-close:hover { background: rgba(255,255,255,0.22); }

    .lb-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      z-index: 10;
      transition: background 0.15s;
      user-select: none;
    }
    .lb-arrow:hover { background: rgba(255,255,255,0.22); }
    .lb-arrow.prev { left: -56px; }
    .lb-arrow.next { right: -56px; }

    @media (max-width: 640px) {
      .lb-arrow.prev { left: 6px; top: auto; bottom: 110px; transform: none; }
      .lb-arrow.next { right: 6px; top: auto; bottom: 110px; transform: none; }
    }

    /* ── App Bottom Nav — mobile only ── */
    .app-bottom-nav {
      display: none; /* hidden on desktop */
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 62px;
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid #E8EAED;
      align-items: center;
      justify-content: space-around;
      z-index: 200;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      box-shadow: 0 -2px 16px rgba(0,0,0,0.06);
    }

    @media (max-width: 768px) {
      .app-bottom-nav { display: flex; }
      .page-body { padding-bottom: 78px; }
    }

    .abn-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: #9AA0A6;
      text-decoration: none;
      font-size: 0.62rem;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      padding: 6px 16px;
      border-radius: 12px;
      transition: color 0.2s;
      min-width: 60px;
    }

    .abn-item.active { color: #1A73E8; }
    .abn-item svg { transition: transform 0.15s; }
    .abn-item:hover svg { transform: translateY(-2px); }
    .abn-item.active svg path, .abn-item.active svg rect,
    .abn-item.active svg circle, .abn-item.active svg polyline { stroke: #1A73E8; }
  </style>
</head>
<body>

<!-- Navigation -->
<nav class="top-nav" style="border-bottom: 2px solid transparent; border-image: linear-gradient(90deg, #1557C9, #1A73E8, #34A853) 1;">
  <a href="home.html" class="nav-back" title="घरी जा">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M19 12H5"/><path d="M12 5l-7 7 7 7"/>
    </svg>
  </a>
  <div class="nav-brand">
    <img src="../assets/images/logo.png" alt="MapFarmer" style="height:50px;width:auto;object-fit:contain;transition:transform 0.2s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
  </div>

  <div style="display:flex; align-items:center; gap:12px;">
    <!-- Language Dropdown -->
    <div class="app-lang-wrap" id="langWrap">
      <svg class="alw-globe" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <select id="langSelect" aria-label="Select Language" onchange="changeLang(this.value)">
        <option value="en">English</option>
        <option value="mr" selected>मराठी</option>
        <option value="hi">हिन्दी</option>
      </select>
      <svg class="alw-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
    </div>

    <a href="capture.html" class="nav-action-btn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      <span id="btn-add-photo" class="btn-txt">फोटो घ्या</span>
    </a>
  </div>
</nav>

<div class="page-body">

  <!-- Greeting -->
  <div class="greeting-bar">
    <div class="greeting-avatar">
      <svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="22" cy="22" r="22" fill="#C8E6C9"/>
        <circle cx="22" cy="17" r="8" fill="#D4A574"/>
        <ellipse cx="22" cy="13" rx="9" ry="5" fill="#34A853"/>
        <rect x="12" y="26" width="20" height="14" rx="5" fill="#A5D6A7"/>
      </svg>
    </div>
    <div class="greeting-text">
      <div class="hi" data-i18n="greeting">नमस्कार</div>
      <div class="name" id="user-name">शेतकरी</div>
    </div>
  </div>

  <!-- Progress -->
  <div class="progress-section">
    <div class="prog-header">
      <span class="prog-title" id="lbl-total-prog">एकूण प्रगती</span>
      <span class="prog-count" id="prog-count">0 / 10</span>
    </div>
    <div class="prog-bar-bg">
      <div class="prog-bar-fill" id="prog-fill" style="width: 0%"></div>
    </div>
    <div class="prog-sublabel" id="prog-label">अजून फोटो घ्यायचे आहेत</div>
  </div>

  <!-- Grid -->
  <div class="section-label" id="lbl-all-steps">सर्व टप्पे</div>
  <div class="steps-grid" id="steps-grid"></div>

</div>

<!-- ── Lightbox Modal ── -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" onclick="closeLightbox()" title="बंद करा">✕</button>
  <button class="lb-arrow prev" onclick="lbNav(-1)" title="मागे">‹</button>

  <div class="lb-content">
    <div class="lb-img-wrap">
      <img id="lb-img" src="" alt="">
    </div>
    <div id="lb-no-photo" class="lb-no-photo" style="display:none"></div>
    <div class="lb-info">
      <span class="lb-title" id="lb-title"></span>
      <span class="lb-num" id="lb-num"></span>
    </div>
    <div class="lb-btn-row">
      <button class="lb-btn primary" onclick="goToStepFromLb()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="2" y="6" width="20" height="15" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-3h5L16 6"/></svg>
        <span id="lb-capture-btn">फोटो घ्या</span>
      </button>
      <button class="lb-btn secondary" id="lb-dl-btn" onclick="downloadPhoto()" style="display:none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span id="lb-dl-label">Download</span>
      </button>
    </div>
  </div>

  <button class="lb-arrow next" onclick="lbNav(1)" title="पुढे">›</button>
</div>

<!-- ── App Bottom Nav ── -->
<nav class="app-bottom-nav">
  <a href="home.html" class="abn-item" id="abn-home">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/>
    </svg>
    <span id="abn-home-lbl">Home</span>
  </a>
  <a href="capture.html" class="abn-item" id="abn-capture">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <rect x="2" y="6" width="20" height="15" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-3h5L16 6"/>
    </svg>
    <span id="abn-capture-lbl">फोटो</span>
  </a>
  <a href="view.html" class="abn-item active" id="abn-gallery">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A73E8" stroke-width="2" stroke-linecap="round">
      <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
    </svg>
    <span id="abn-gallery-lbl">गॅलरी</span>
  </a>
  <a href="instructions.html" class="abn-item" id="abn-info">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <span id="abn-info-lbl">माहिती</span>
  </a>
</nav>

<div id="toast" class="google-toast"></div>

<script src="../js/config.js"></script>
<script src="../js/state.js"></script>
<script src="../js/utils.js"></script>
<script>
  if (!isLoggedIn()) { window.location.href = 'login.html'; }
  var lbCurrentStep = 0;

  function renderViewGrid() {
    var lang = state.lang || 'mr';
    var defaultName = lang === 'en' ? 'Farmer' : (lang === 'hi' ? 'किसान' : 'शेतकरी');
    document.getElementById('user-name').textContent = (state.user && state.user.name) ? state.user.name : defaultName;

    var done = state.stepPhotos.filter(function(p) { return p !== null; }).length;

    document.getElementById('prog-count').textContent = done + ' / 10';
    document.getElementById('prog-fill').style.width = (done * 10) + '%';

    var totalProgLabels = { mr: 'एकूण प्रगती', en: 'Overall Progress', hi: 'कुल प्रगति' };
    var allStepsLabels  = { mr: 'सर्व १० शेती टप्पे', en: 'All 10 Farming Steps', hi: 'सभी १० कृषि चरण' };
    var addPhotoLabels  = { mr: 'फोटो घ्या', en: 'Take Photo', hi: 'फोटो लें' };

    var lblProg = document.getElementById('lbl-total-prog');
    var lblSteps = document.getElementById('lbl-all-steps');
    var btnAdd = document.getElementById('btn-add-photo');

    if (lblProg) lblProg.textContent = totalProgLabels[lang] || totalProgLabels.mr;
    if (lblSteps) lblSteps.textContent = allStepsLabels[lang] || allStepsLabels.mr;
    if (btnAdd) btnAdd.textContent = addPhotoLabels[lang] || addPhotoLabels.mr;

    var label = document.getElementById('prog-label');
    if (label) {
      if (done === 10) {
        label.textContent = lang === 'en' ? 'All 10 steps completed! Outstanding!' : (lang === 'hi' ? 'सभी १० चरण पूर्ण! बधाई हो!' : 'सर्व १० टप्पे पूर्ण! अभिनंदन!');
        label.style.color = '#34A853';
      } else if (done > 0) {
        label.textContent = lang === 'en' ? ((10 - done) + ' steps remaining to complete') : (lang === 'hi' ? ((10 - done) + ' चरण बाकी हैं') : ((10 - done) + ' टप्पे बाकी आहेत'));
      } else {
        label.textContent = lang === 'en' ? 'Tap "Take Photo" to begin logging' : (lang === 'hi' ? 'शुरुआत करने के लिए "फोटो लें" पर क्लिक करें' : 'सुरुवात करायला "फोटो घ्या" वर क्लिक करा');
      }
    }

    var grid = document.getElementById('steps-grid');
    if (!grid) return;

    var photoDoneLabels = { mr: 'फोटो नोंद सुरक्षित', en: 'Photo verified', hi: 'फोटो दर्ज' };
    var photoPendingLabels = { mr: 'फोटो बाकी', en: 'Pending photo', hi: 'फोटो शेष' };

    grid.innerHTML = STEPS.map(function(step, i) {
      var photo = state.stepPhotos[i];
      var hasDone = photo !== null;
      var name = step[lang] || step.mr;

      var imageArea = hasDone
        ? '<img src="' + photo + '" alt="' + name + '" style="width:100%;height:100%;object-fit:cover;">'
        : '<div class="cell-placeholder" style="background:' + step.bg + '">' + step.emoji + '</div>';

      var doneBadge = hasDone
        ? '<div class="cell-done-badge"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg></div>'
        : '';

      return '<div class="step-cell ' + (hasDone ? 'has-photo' : '') + '" onclick="goToStep(' + i + ')" title="Click to open ' + name + '">' +
        '<div class="cell-image-area">' +
          imageArea +
          '<div class="cell-num ' + (hasDone ? 'done' : '') + '">' + (i + 1) + '</div>' +
          doneBadge +
        '</div>' +
        '<div class="cell-footer">' +
          '<div class="cell-name">' + step.emoji + ' ' + name + '</div>' +
          '<div class="cell-status ' + (hasDone ? 'done-text' : '') + '">' +
            (hasDone ? (photoDoneLabels[lang] || 'फोटो जोडला') : (photoPendingLabels[lang] || 'फोटो नाही')) +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function goToStep(i) {
    openLightbox(i);
  }

  /* ── Lightbox ── */
  function openLightbox(idx) {
    lbCurrentStep = idx;
    renderLightbox();
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }

  function renderLightbox() {
    var lang = state.lang || 'mr';
    var step = STEPS[lbCurrentStep];
    var photo = state.stepPhotos[lbCurrentStep];
    var name = step[lang] || step.mr;

    var captureLabels = { mr: 'फोटो घ्या', en: 'Take Photo', hi: 'फोटो लें' };
    var dlLabels = { mr: 'डाउनलोड', en: 'Download', hi: 'डाउनलोड' };
    var noPhotoLabels = { mr: 'अजून फोटो नाही — कॅमेरा बटण दाबा', en: 'No photo yet — tap Take Photo', hi: 'अभी फोटो नहीं — कैमरा बटन दबाएं' };

    document.getElementById('lb-title').textContent = step.emoji + ' ' + name;
    document.getElementById('lb-num').textContent = (lbCurrentStep + 1) + ' / 10';
    document.getElementById('lb-capture-btn').textContent = captureLabels[lang] || captureLabels.mr;
    document.getElementById('lb-dl-label').textContent = dlLabels[lang] || dlLabels.mr;

    var imgEl = document.getElementById('lb-img');
    var noPhotoEl = document.getElementById('lb-no-photo');
    var dlBtn = document.getElementById('lb-dl-btn');

    if (photo) {
      imgEl.src = photo;
      imgEl.style.display = 'block';
      noPhotoEl.style.display = 'none';
      dlBtn.style.display = 'inline-flex';
    } else {
      imgEl.src = '';
      imgEl.style.display = 'none';
      noPhotoEl.textContent = noPhotoLabels[lang] || noPhotoLabels.mr;
      noPhotoEl.style.display = 'block';
      dlBtn.style.display = 'none';
    }
  }

  function lbNav(dir) {
    lbCurrentStep = (lbCurrentStep + dir + 10) % 10;
    renderLightbox();
  }

  function goToStepFromLb() {
    closeLightbox();
    state.currentStep = lbCurrentStep;
    saveState();
    window.location.href = 'capture.html?step=' + lbCurrentStep;
  }

  function downloadPhoto() {
    var photo = state.stepPhotos[lbCurrentStep];
    if (!photo) return;
    var lang = state.lang || 'mr';
    var step = STEPS[lbCurrentStep];
    var a = document.createElement('a');
    a.href = photo;
    a.download = 'step-' + (lbCurrentStep + 1) + '-' + (step[lang] || step.mr) + '.jpg';
    a.click();
  }

  /* Keyboard + swipe for lightbox */
  document.addEventListener('keydown', function(e) {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'ArrowRight') lbNav(1);
    else if (e.key === 'ArrowLeft') lbNav(-1);
    else if (e.key === 'Escape') closeLightbox();
  });

  var lbTouchX = 0;
  document.getElementById('lightbox').addEventListener('touchstart', function(e) {
    lbTouchX = e.changedTouches[0].clientX;
  }, { passive: true });
  document.getElementById('lightbox').addEventListener('touchend', function(e) {
    var dx = e.changedTouches[0].clientX - lbTouchX;
    if (Math.abs(dx) > 50) lbNav(dx < 0 ? 1 : -1);
  }, { passive: true });

  /* Update bottom nav labels based on lang */
  function updateBottomNav() {
    var lang = state.lang || 'mr';
    var labels = {
      mr: { home: 'होम', capture: 'फोटो', gallery: 'गॅलरी', info: 'माहिती' },
      en: { home: 'Home', capture: 'Capture', gallery: 'Gallery', info: 'Guide' },
      hi: { home: 'होम', capture: 'फोटो', gallery: 'गैलरी', info: 'जानकारी' }
    };
    var l = labels[lang] || labels.mr;
    document.getElementById('abn-home-lbl').textContent = l.home;
    document.getElementById('abn-capture-lbl').textContent = l.capture;
    document.getElementById('abn-gallery-lbl').textContent = l.gallery;
    document.getElementById('abn-info-lbl').textContent = l.info;
  }

  applyLang();
  renderViewGrid();
  updateBottomNav();

  window.addEventListener('languageChanged', function() {
    renderViewGrid();
    updateBottomNav();
    if (document.getElementById('lightbox').classList.contains('open')) renderLightbox();
  });
</script>
</body>
</html>
