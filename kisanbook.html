<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>KisanBook — Smart Agriculture Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif;
      background: #F8F9FA;
      color: #202124;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .launcher-card {
      background: #FFFFFF;
      border: 1.5px solid #E8EAED;
      border-radius: 28px;
      padding: 44px 36px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 12px 40px rgba(0,0,0,0.08);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .launcher-icon {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, #1B5E20, #34A853);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 20px rgba(52,168,83,0.3);
    }
    .launcher-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: #1B5E20;
    }
    .launcher-desc {
      font-size: 0.94rem;
      color: #5F6368;
      line-height: 1.6;
    }
    .actions-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      margin-top: 10px;
    }
    .btn-act-primary {
      background: #34A853;
      color: #FFFFFF;
      padding: 14px 20px;
      border-radius: 12px;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 2px 8px rgba(52,168,83,0.3);
      transition: background 0.2s, transform 0.15s;
    }
    .btn-act-primary:hover {
      background: #2E9E4A;
      transform: translateY(-2px);
    }
    .btn-act-sec {
      background: #F1F3F4;
      color: #202124;
      padding: 13px 20px;
      border-radius: 12px;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .btn-act-sec:hover {
      background: #E8EAED;
    }
  </style>
</head>
<body>

<div class="launcher-card">
  <div style="margin-bottom: 8px;">
    <img src="assets/images/logo.png" alt="MapFarmer" style="height: 70px; width: auto; object-fit: contain;">
  </div>

  <h1 class="launcher-title">KisanBook / Farmer App</h1>
  <p class="launcher-desc" data-i18n="tagline">शेतकऱ्यांसाठी डिजिटल डायरी — संपूर्ण शेती प्रक्रिया टप्याटप्याने नोंदवा</p>

  <!-- Google Trilingual Switcher -->
  <div class="lang-switcher-pill" role="group" aria-label="Language selector">
    <button type="button" class="lang-pill-btn" data-lang="en">English</button>
    <button type="button" class="lang-pill-btn active" data-lang="mr">मराठी</button>
    <button type="button" class="lang-pill-btn" data-lang="hi">हिन्दी</button>
  </div>

  <div class="actions-grid">
    <a href="pages/home.html" class="btn-act-primary" id="autoLaunchBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      <span data-i18n="openApp">App उघडा</span>
    </a>
    <a href="pages/login.html" class="btn-act-sec" data-i18n="loginBtn">लॉगिन करा</a>
    <a href="index.html" class="btn-act-sec" data-i18n="learnMore">अधिक माहिती (वेबसाइट)</a>
  </div>
</div>

<div id="toast" class="google-toast"></div>

<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script>
  if (isLoggedIn()) {
    // If user is already authenticated, automatically launch home
    window.location.replace('pages/home.html');
  }
</script>
</body>
</html>
